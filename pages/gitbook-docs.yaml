$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: balena docs
  structure:
    - type: section
      key: section-1
      title: Documentation
      path: balena-docs
      description: ""
      default: true
      children:
        - type: space
          key: space-docs
          title: Documentation
          path: docs
          default: true
          content:
            directory: ./
    - type: section
      key: section-2
      title: Release notes
      path: release-notes
      children:
        - type: space
          key: space-1
          title: Changelog
          path: changelog
          default: true
          draft: true
          content:
            directory: ./release-notes/changelog
