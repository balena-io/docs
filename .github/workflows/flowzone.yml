name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master, gitbook]
  push:
    branches: [main, master, gitbook]

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.21
    secrets: inherit
    with:
      docusaurus_website: false
      disable_versioning: true
